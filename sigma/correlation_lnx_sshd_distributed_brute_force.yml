title: OpenSSH Failed Password Against Named Account
id: 6c436060-a8f8-41e2-b7ce-f87b051c8260
name: log_hunter_sshd_failed_password_distributed
status: experimental
description: |
    Base rule for the distributed brute force correlation below. Matches a single failed SSH password attempt.
    Assumes the SIEM extracts the source address into src_ip and the targeted account into user; rename them to match your field mapping.
references:
    - https://github.com/Ezashi9/log-hunter
author: Eisa Chaudry
date: 2026-10-15
tags:
    - attack.credential-access
    - attack.t1110
logsource:
    product: linux
    service: sshd
detection:
    keywords:
        - 'Failed password for '
    condition: keywords
falsepositives:
    - Users mistyping their password
level: informational
